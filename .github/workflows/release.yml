name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build
        shell: cmd
        run: build.bat

      - name: Zip Portable
        shell: cmd
        run: |
          .venv\Scripts\python.exe -c "import shutil; from pathlib import Path; from fatty import portable_dir_name; root = Path('dist'); portable = root / portable_dir_name(); exe = portable / 'FaTTY.exe'; assert exe.is_file(), f'missing {exe}; dist={list(root.iterdir()) if root.is_dir() else []}'; zip_base = root / portable.name; shutil.make_archive(str(zip_base), 'zip', portable); print('Wrote', zip_base.with_suffix('.zip'))"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/FaTTY * Setup.exe
            dist/FaTTY * OneFile.exe
            dist/FaTTY * Portable.zip
