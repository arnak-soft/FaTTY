name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            third_party/vcpkg
            build/vcpkg_installed
          key: vcpkg-rel-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        shell: cmd
        run: build.bat

      - name: Zip Portable
        shell: pwsh
        run: |
          $ver = (Get-Content build/generated/_version.txt -Raw).Trim()
          $portable = Get-ChildItem dist -Directory | Where-Object { $_.Name -like "FaTTY *Portable" } | Select-Object -First 1
          if (-not $portable) { throw "Portable folder missing" }
          $zip = Join-Path dist ($portable.Name + ".zip")
          Compress-Archive -Path ($portable.FullName + "\*") -DestinationPath $zip -Force
          Write-Host "Wrote $zip"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/FaTTY * Setup.exe
            dist/FaTTY * OneFile.exe
            dist/FaTTY * Portable.zip
