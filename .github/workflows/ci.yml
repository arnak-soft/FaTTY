name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m compileall -q fatty scripts launch.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import package
        run: python -c "import fatty; print(fatty.__version__)"
