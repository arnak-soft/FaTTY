name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            third_party/vcpkg
            build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: cmd
        run: |
          if not exist third_party\vcpkg\vcpkg.exe (
            git clone --depth 1 https://github.com/microsoft/vcpkg.git third_party\vcpkg
            call third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          )
          cmake --preset msvc-static

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
